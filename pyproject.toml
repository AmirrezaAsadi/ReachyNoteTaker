[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barnaby_bat"
version = "0.1.0"
description = "Barnaby the Bat — a friendly Reachy Mini conversation companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini",
    "parakeet-mlx",
    "mlx-audio",
    "mlx-lm",
    "silero-vad",
    "torch",
    "torchaudio",
    "sounddevice",
    "rich",
    "numpy",
    "python-dotenv",
    "httpx",
    "pyyaml",
    "soundfile",
    "huggingface-hub",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
barnaby_bat = "barnaby_bat.main:BarnabyBat"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
barnaby_bat = ["**/*"]
